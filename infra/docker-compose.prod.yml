# Production stack on the EC2 box: Redis + Python engine + Go gateway (serves the console).
# Only the gateway is public. Redis and the engine live on the internal Docker network.
#
#   docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --build
name: sentineldesk

services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --save 300 1 --appendonly yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: ..
      dockerfile: infra/Dockerfile.engine
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARTIFACT_CACHE: /cache
    volumes:
      - artifact-cache:/cache
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gateway
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "8080"
      ENGINE_URL: http://engine:8000
      MOCK_ENGINE: ${MOCK_ENGINE:-false}
    ports:
      - "80:8080"
    depends_on:
      engine:
        condition: service_healthy

volumes:
  redis-data:
  artifact-cache:
