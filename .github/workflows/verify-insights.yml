name: Verify insights JSON

on:
  push:
    paths:
      - 'analytics/**'
      - 'frontend/src/features/insights/data/**'
  pull_request:
    paths:
      - 'analytics/**'
      - 'frontend/src/features/insights/data/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pandas
        run: pip install pandas
      - name: DA-02 operations insights verify
        run: python3 analytics/verify_operations_insights.py